name: Build Community Images

# The image only ever contains apps/web, apps/collab and apps/api (see
# Dockerfile). A README edit or a CLI-only change cannot alter the image, so it
# does not need one. Deliberately a deny-list rather than an allow-list:
# anything new at the repo root still triggers a build. The list is spelled out
# twice because GitHub Actions does not support YAML anchors, so keep both copies
# in sync.
on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'apps/cli/**'
      - 'apps/e2e/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
  pull_request:
    branches:
      - main
      - dev
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'apps/cli/**'
      - 'apps/e2e/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
  # Re-publishing by hand, e.g. to move :latest onto an already-built commit
  # after a release-marker-only change was pushed.
  workflow_dispatch:

permissions:
  contents: read

# See api-lint.yaml: one live run per PR, dev runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Published to this fork's Docker Hub namespace. The previous ghcr.io/learnhouse/app
  # target cannot work here: a fork's GITHUB_TOKEN cannot write to a package owned by
  # the upstream organisation, so that push always failed with a 403.
  DOCKERHUB_IMAGE: tenuka22/learnhouse-lk

jobs:
  build:
    name: Build and push (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Credentials come from repo settings, never from this file:
      #   vars.DOCKERHUB_USERNAME -> Settings > Secrets and variables > Actions > Variables
      #   secrets.DOCKERHUB_TOKEN -> Settings > Secrets and variables > Actions > Secrets
      # DOCKERHUB_IMAGE above must keep matching DOCKERHUB_USERNAME, or the push
      # targets someone else's namespace.
      # Skipped on pull_request: a PR gets neither, and its build must still prove
      # the image compiles.
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          BRANCH="${{ github.ref_name }}"

          TAGS="${{ env.DOCKERHUB_IMAGE }}:${BRANCH}-${SHA_SHORT}"
          TAGS="${TAGS},${{ env.DOCKERHUB_IMAGE }}:${BRANCH}"

          # Only a main build may move :latest. The self-hosting compose stacks in
          # deploy/ track that tag, so a dev build landing on it would push an
          # unreviewed commit onto running installs.
          if [ "$BRANCH" = "main" ]; then
            TAGS="${TAGS},${{ env.DOCKERHUB_IMAGE }}:latest"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      # linux/amd64 only, matching the tag the compose stacks already pull. Adding
      # arm64 means a real multi-platform manifest list (build both, join by digest
      # in a second job) rather than the single push this job does.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: |
            LEARNHOUSE_PUBLIC=true
          cache-from: type=gha,scope=dockerhub-amd64
          cache-to: type=gha,mode=max,scope=dockerhub-amd64
          tags: ${{ steps.meta.outputs.tags }}
          push: ${{ github.event_name != 'pull_request' }}

  service-images:
    name: Service image (${{ matrix.service }})
    runs-on: ubuntu-latest
    # The Dockerfiles under apps/ build the per-service
    # images. Nothing in this repo built them: the job above only builds the
    # root Dockerfile, so a change that broke a service image passed every
    # check here and failed later, in the pipeline that ships it. Build them,
    # never push them; publishing those tags stays with the image pipeline.
    strategy:
      fail-fast: false
      matrix:
        service: [api, web, collab]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v7
        with:
          context: ./apps/${{ matrix.service }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=service-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=service-${{ matrix.service }}
